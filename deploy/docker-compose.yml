services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    ports:
      - "24930:24930"
      - "24931:24931/udp"
      - "24932:24932"
    volumes:
      - starskiff-data:/data
    restart: unless-stopped

  # 节点示例：先 enroll（交互生成身份写入卷），再 up。
  #   docker compose run --rm node /app/starskiff enroll -c /data/starskiff.json \
  #       --server https://<server>:24930 --token skk_…
  # TUN 模式需追加：devices: ["/dev/net/tun:/dev/net/tun"] 与 cap_add: [NET_ADMIN]。
  node:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.node
    volumes:
      - node-data:/data
    restart: unless-stopped

volumes:
  starskiff-data:
  node-data:
