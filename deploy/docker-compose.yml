services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    ports:
      - "24930:24930"
      - "24931:24931/udp"
      - "24932:24932"
    volumes:
      - starskiff-data:/data
    restart: unless-stopped

  # 节点：先 enroll 生成身份（一次性；ENTRYPOINT 是 up，enroll 须 --entrypoint 覆盖）：
  #   docker compose run --rm --entrypoint /app/starskiff node \
  #       enroll -c /data/starskiff.json --server https://<server>:24930 --token skk_…
  # 之后 docker compose up -d 长期运行。TUN 模式需追加：
  #   devices: ["/dev/net/tun:/dev/net/tun"] 与 cap_add: [NET_ADMIN]。
  node:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.node
    volumes:
      - node-data:/data
    restart: unless-stopped

volumes:
  starskiff-data:
  node-data:
